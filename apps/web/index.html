<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Malmoon</title>
    <script>
      // Set the theme before first paint. The design tokens and HeroUI both read data-theme.
      document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
