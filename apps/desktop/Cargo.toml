[package]
name = "malmoon-desktop"
description = "The Malmoon desktop app: a prompter overlay for live meetings."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "malmoon"
path = "src/main.rs"

[dependencies]
malmoon-core = { workspace = true }
malmoon-tokens = { workspace = true }
malmoon-ui = { workspace = true }

anyhow = { workspace = true }
futures-channel = "0.3"
futures-util = { workspace = true }
gpui-kit = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSGraphics", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
raw-window-handle = "0.6"

[lints]
workspace = true
