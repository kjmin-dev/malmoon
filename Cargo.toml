[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop", "apps/gateway"]
# Local experiments keep their own lockfile and target directory.
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
malmoon-auth = { path = "crates/malmoon-auth" }
malmoon-core = { path = "crates/malmoon-core" }
malmoon-tokens = { path = "crates/malmoon-tokens" }
malmoon-ui = { path = "crates/malmoon-ui" }

anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
futures-util = "0.3"
# GPUI, GPUI Component and their assets. GPUI has no stable release, so pin exactly.
gpui-kit = "=0.9.1"
keyring = "4"
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "aws_lc_rs"] }
open = "5"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-aws-lc-rs",
  "postgres",
  "uuid",
  "time",
  "migrate",
  "macros",
] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.30"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "12"
url = "2"
uuid = { version = "1", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# GPUI is unusably slow without optimizations, even in dev builds.
[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-pre-platform]
opt-level = 3

[profile.dev.package.gpui-pre-macos]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
